name: Validate 

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/validate-oidc.yml

permissions:
  contents: read
  id-token: write

jobs:
  validate-oidc:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::897126534951:role/EKS-Basavaraj-01
          aws-region: ap-south-1

      - name: Verify assumed AWS identity
        run: aws sts get-caller-identity
